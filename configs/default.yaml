# Default experiment configuration. Every reported result references the config and seed used.
seed: 42

data:
  region: VIC1
  start: "2023-01-01"        # inclusive, NEM time (AEST, UTC+10)
  end: "2026-10-31"          # inclusive, NEM time
  raw_dir: data/raw
  processed_dir: data/processed
  weather:
    # Melbourne CBD (Olympic Park area). Single point; regional coverage is a known limitation.
    latitude: -37.8136
    longitude: 144.9631
    # Assumed delay (hours) between a weather value's valid time and when it is usable at a
    # forecast origin. Prevents using weather that would not yet have been observed/published.
    availability_lag_hours: 1

forecast:
  horizons_minutes: [30, 240]
  # Horizons used to build the price path for rolling-horizon dispatch (30-min grid to 4 h).
  dispatch_horizons_minutes: [30, 60, 90, 120, 150, 180, 210, 240]
  quantiles: [0.1, 0.5, 0.9, 0.99]
  target_transform: asinh   # one of: none, asinh
  asinh_scale: 100.0        # $/MWh; asinh(price / scale)

spike:
  method: fixed             # one of: fixed, percentile
  fixed_threshold: 300.0    # $/MWh
  percentile: 99.0          # used when method == percentile (computed on training fold only)

validation:
  # Walk-forward: expanding training window, test folds of this length, embargo = horizon.
  initial_train_months: 12
  test_fold_months: 3

battery:
  power_mw: 100.0
  energy_mwh: 200.0
  round_trip_efficiency: 0.90
  soc_min_frac: 0.10
  soc_max_frac: 0.90
  soc_initial_frac: 0.50
  rolling_resolve_minutes: 30
  lookahead_hours: 4

tracking:
  mlflow_tracking_uri: sqlite:///mlflow.db
  experiment_name: nem-vic1-spikes
