[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "nemspike"
version = "0.1.0"
description = "Probabilistic price spike forecasting for the NEM (VIC1) with battery dispatch evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "requests>=2.31",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "mlflow>=2.12",
    "matplotlib>=3.8",
    "typer>=0.12",
    "holidays>=0.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
nemspike = "nemspike.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nemspike"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "PD", "NPY", "RUF"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["network: tests that hit external APIs (skipped in CI)"]
