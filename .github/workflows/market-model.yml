name: market-model

on:
  push:
    branches: [main]
    paths: ["projects/market-model/**", "pyproject.toml", "uv.lock", ".github/workflows/market-model.yml"]
  pull_request:
    paths: ["projects/market-model/**", "pyproject.toml", "uv.lock", ".github/workflows/market-model.yml"]

defaults:
  run:
    working-directory: projects/market-model

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install
        run: uv sync --package nemmodel --extra dev --python ${{ matrix.python-version }}
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test (synthetic data and committed inputs; no network)
        run: uv run pytest
