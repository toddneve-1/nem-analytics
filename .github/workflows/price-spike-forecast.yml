name: price-spike-forecast

on:
  push:
    branches: [main]
    paths: ["projects/price-spike-forecast/**", "pyproject.toml", "uv.lock", ".github/workflows/price-spike-forecast.yml"]
  pull_request:
    paths: ["projects/price-spike-forecast/**", "pyproject.toml", "uv.lock", ".github/workflows/price-spike-forecast.yml"]

defaults:
  run:
    working-directory: projects/price-spike-forecast

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install
        run: uv sync --package nemspike --extra dev --python ${{ matrix.python-version }}
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test (offline; network tests skipped)
        run: uv run pytest -m "not network"
